<!DOCTYPE html>
<html>
<head>
  <title>Dynamic Greeting</title>
</head>
<body>

<h2 id="greeting"></h2>

<script>
  const now = new Date();
  const hour = now.getHours();
  let message;

  if (hour < 12) {
    message = "Good Morning!";
  } else if (hour < 18) {
    message = "Good Afternoon!";
  } else {
    message = "Good Evening!";
  }

  document.getElementById("greeting").textContent = message;
</script>

</body>
</html>
