<!DOCTYPE html>
<html>
<head>
  <title>Interactive Quiz</title>
</head>
<body>

  <h2>Interactive Quiz</h2>

  <p>What is the short form of 'Web Application Development'?</p>

  <input type="text" id="answer" placeholder="Enter your answer here">
  <button onclick="checkAnswer()">Submit</button>

  <p id="result"></p>

  <script>
    function checkAnswer() {
      const userAnswer = document.getElementById("answer").value.trim().toUpperCase();
      const correctAnswer = "WAD";

      if (userAnswer === correctAnswer) {
        document.getElementById("result").textContent = "Correct!";
      } else {
        document.getElementById("result").textContent = "Incorrect. The correct answer is WAD.";
      }
    }
  </script>

</body>
</html>
